/* ---- dd.core.js ---- */
/* ===== DigiDoughnut Platform · dd.core =====
   The `dd` namespace, a tiny event bus, device/page detection, and dd.start(), which boots
   a program. Programs never touch storage or the page skeleton directly: they get a `ctx`
   with the current data and an update() function. */
(function () {
  "use strict";
  var dd = window.dd = window.dd || {};
  dd.platformVersion = (window.DD_BUILD && window.DD_BUILD.platform) || "dev";

  function checkContract(p) {

    for (var i = 0; i < REQUIRED.length; i++) if (p[REQUIRED[i]] == null) return "DD_PROGRAM." + REQUIRED[i] + " is missing";
    if (!/^[a-z0-9]+$/.test(p.id)) return "DD_PROGRAM.id must be lowercase letters and digits";
    return null;

  var program = null, data = null, meta = { example: false };

  function ctx() {
    return { data: data, update: dd.update, replaceData: dd.replaceData, ui: dd.ui, root: document.getElementById("dd-app"), env: dd.env };
  }
  function render() {
    try { program.render(ctx()); }
    catch (e) { dd.errors.record("render", e); dd.ui.notice("render-fail", "Something on this page didn't draw properly. Reloading usually fixes it.", "warn"); }
  }

    if (!res.ok) dd.ui.notice("save-fail", dd.errors.friendly(res.reason).title + " " + dd.errors.friendly(res.reason).help, "warn");

  dd.getProgram = function () { return program; };
  dd.isExample = function () { return meta.example; };

  function paintExampleNotice() {
    if (!meta.example || program.showExampleNotice === false) { dd.ui.clearNotice("example"); return; }
    dd.ui.notice("example", program.exampleNotice || "You're looking at example numbers so you can try things out.", "info", [

          dd.replaceData(program.emptyData(), { example: false, source: "start-fresh" });
          dd.ui.toast("All clear. It's yours now.");

/* ---- dd.store.js ---- */
/* ===== DigiDoughnut Platform · dd.store =====
   Everything saved in the browser goes through here.

   Storage names (plan, "Template architecture"):
     shared by every program on the same web address:  dd_<thing>_v1           e.g. dd_ai_connections_v1
     belonging to one program:                          dd_<program>_<thing>_v1 e.g. dd_profitcoach_data_v1

   Program data is saved inside an envelope so we always know which program and which schema
   version wrote it:
     { dd:1, program:"profitcoach", schemaVersion:1, savedAt:"2026-10-06T…", example:false, data:{…} }
   Data saved without an envelope (the Profit Coach POC) is read as schema version 0 and handed
   to the program's migrate(). Nothing is ever thrown away: anything we can't read is copied to
   dd_<program>_data_recovery_v1 first. */
(function () {
  "use strict";
  var dd = window.dd = window.dd || {};
  var store = dd.store = {};

  store.sharedKey = function (thing) { return "dd_" + thing + "_v1"; };
  store.programKey = function (programId, thing) { return "dd_" + programId + "_" + thing + "_v1"; };

  /* ---------- safe access: browsers can block or fill storage ---------- */
  function ls() { try { return window.localStorage; } catch (e) { return null; } }

  store.available = function () {
    var s = ls(); if (!s) return false;
    try { s.setItem("dd__probe", "1"); s.removeItem("dd__probe"); return true; } catch (e) { return false; }
  };
  store.get = function (key) { var s = ls(); if (!s) return null; try { return s.getItem(key); } catch (e) { return null; } };
  /* returns {ok:true} or {ok:false, reason:"storage_full"|"storage_blocked"} */
  store.set = function (key, value) {
    var s = ls(); if (!s) return { ok: false, reason: "storage_blocked" };
    try { s.setItem(key, value); return { ok: true }; }
    catch (e) {
      var full = e && (e.name === "QuotaExceededError" || e.code === 22 || e.code === 1014);
      dd.errors.record("store.set", e);
      return { ok: false, reason: full ? "storage_full" : "storage_blocked" };
    }
  };
  store.remove = function (key) { var s = ls(); if (s) try { s.removeItem(key); } catch (e) {} };
  store.getJSON = function (key) { var t = store.get(key); if (t == null) return null; try { return JSON.parse(t); } catch (e) { return undefined; } };
  store.setJSON = function (key, value) { return store.set(key, JSON.stringify(value)); };

  /* ---------- program data ---------- */
  function keepForRecovery(programId, raw, why) {
    dd.errors.record("store.recovery", why);
    store.set(store.programKey(programId, "data_recovery"), typeof raw === "string" ? raw : JSON.stringify(raw));
  }

  /* Load this program's data. Returns {data, meta:{example}, source, notice?}
     source: "example" (first visit), "saved", "migrated", "recovered" */
  store.loadData = function (program) {
    var key = store.programKey(program.id, "data");
    var rawText = store.get(key);

    if (rawText == null) {
      return { data: program.exampleData(), meta: { example: true }, source: "example" };
    }

    var raw; try { raw = JSON.parse(rawText); } catch (e) { raw = undefined; }
    var isEnvelope = raw && raw.dd === 1 && "data" in raw;
    var fromVersion = isEnvelope ? (raw.schemaVersion | 0) : 0;
    var body = isEnvelope ? raw.data : raw;
    var example = isEnvelope ? !!raw.example : false;
    var source = "saved";

    try {
      // Text that isn't readable data must never reach migrate(): a lenient migrate could
      // turn it into an empty list and the original would be overwritten on the next save.
      if (raw === undefined || raw === null || typeof raw !== "object") throw new Error("saved data is not readable");
      if (isEnvelope && raw.program && raw.program !== program.id) throw new Error("saved by program " + raw.program);
      if (fromVersion > program.schemaVersion) {
        // Saved by a NEWER version of this program. Keep a copy, then try to carry on.
        keepForRecovery(program.id, rawText, "newer schema " + fromVersion);
      } else if (fromVersion < program.schemaVersion) {
        body = program.migrate(body, fromVersion);
        source = "migrated";
      }
      if (!program.validateData(body)) throw new Error("validateData said no (from v" + fromVersion + ")");
    } catch (e) {
      keepForRecovery(program.id, rawText, e);
      return {
        data: program.emptyData(), meta: { example: false }, source: "recovered",
        notice: "We couldn't read your saved numbers, so we've started a fresh page. Your old numbers are kept safe on this device. Contact DigiDoughnut and we'll help you get them back."
      };
    }

    if (source === "migrated") store.saveData(program, body, { example: example });
    return { data: body, meta: { example: example }, source: source };
  };

  store.saveData = function (program, data, meta) {
    var res = store.setJSON(store.programKey(program.id, "data"), {
      dd: 1, program: program.id, schemaVersion: program.schemaVersion,
      savedAt: new Date().toISOString(), example: !!(meta && meta.example), data: data
    });
    if (res.ok) askToKeepStorage(program);
    return res;
  };

  store.dataBytes = function (programId) { var t = store.get(store.programKey(programId, "data")); return t ? t.length : 0; };

  /* ---------- ask the browser to keep our storage ----------
     Asked once, after the buyer's first real save, so browsers that show a prompt
     (Firefox) show it at a moment that makes sense. Chrome and Safari decide silently. */

  // On load, report what the browser already decided (from an earlier visit), so the
  // diagnostic doesn't say "not asked" just because nothing was saved on this visit yet.

    if (navigator.storage && navigator.storage.persisted) {
      navigator.storage.persisted().then(function (already) {
        if (store.persisted === "not asked") store.persisted = already ? "yes" : "not yet";
      }, function () {});
    } else { store.persisted = "unsupported"; }
  } catch (e) {}
  function askToKeepStorage(program) {
    if (store.persisted === "not yet") store.persisted = "not asked";
    if (store.persisted !== "not asked") return;
    if (!(navigator.storage && navigator.storage.persist)) { store.persisted = "unsupported"; return; }
    store.persisted = "asking";
    navigator.storage.persisted().then(function (already) {
      return already || navigator.storage.persist();
    }).then(function (granted) { store.persisted = granted ? "yes" : "no"; })
      .catch(function (e) { store.persisted = "error"; dd.errors.record("store.persist", e); });
  }
})();

/* ---- dd.errors.js ---- */
/* ===== DigiDoughnut Platform · dd.errors =====
   Every failure the buyer could see is one of a few named types with one friendly message.
   Raw technical detail is recorded for the support diagnostic only, with codes masked.
   RULE: buyer-facing text never contains provider wording, JSON, status codes or jargon. */
(function () {
  "use strict";
  var dd = window.dd = window.dd || {};
  var errors = dd.errors = {};

  /* {company} is filled in with the AI company's friendly name, e.g. "Google". */
  var TYPES = {
    // the seven AI error types (plan, "AI connections")
    offline:       ["You're not connected to the internet.", "Check your Wi-Fi or data, then try again."],
    bad_code:      ["That code didn't work.", "It may have a typo or a missing piece. Copy it fresh from {company} and paste it again."],
    not_allowed:   ["That code isn't allowed to do this.", "Make a new code on {company}'s site and paste it here."],
    out_of_share:  ["You've used today's free share.", "It refills on its own. Try again later or tomorrow."],
    busy:          ["{company}'s servers are having a busy moment.", "Wait a minute and try again. This usually clears on its own."],
    timeout:       ["That took too long, so we stopped waiting.", "Tap Try again. If it keeps happening, check your internet."],
    unexpected:    ["Something unexpected happened.", "Wait a moment and try again."],
    // platform types
    storage_full:    ["This browser's storage is full, so your last change wasn't saved.", "Make a backup, then clear some space or old data."],
    storage_blocked: ["This browser isn't letting the program save.", "Private or incognito windows often block saving. Open the program in a normal window."]
  };

  errors.types = Object.keys(TYPES);

  /* -> {type, title, help} in plain words */

    var t = TYPES[type] || TYPES.unexpected;
    var company = (vars && vars.company) || "the AI company";
    function fill(s) { return s.replace(/\{company\}/g, company).replace(/^the AI company's/, "The AI company's"); }
    return { type: TYPES[type] ? type : "unexpected", title: fill(t[0]), help: fill(t[1]) };
  };

  /* Generic first guess from an HTTP status or a thrown error. AI adapters (Phase 2) refine
     this with the provider's own error reason. A 400 is NOT "bad code": it usually means a bug
     on our side, so it maps to "unexpected" (fixes POC problem #6). */

    info = info || {};
    var name = info.name || (info.error && info.error.name);
    if (name === "AbortError" || name === "TimeoutError") return "timeout";
    if (navigator.onLine === false) return "offline";
    var s = info.status;

    if (s === 401) return "bad_code";
    if (s === 403) return "not_allowed";
    if (s === 429) return "out_of_share";
    if (s >= 500 && s <= 599) return "busy";
    return "unexpected";
  };

  /* Show a friendly message in a status box. kind defaults to "err". */
  errors.show = function (el, type, vars, kind) {
    var f = errors.friendly(type, vars);
    dd.ui.status(el, kind || "err", f.title, f.help);
    return f;
  };

  /* ---------- raw detail for support only ---------- */
  var log = [];
  // Anything that looks like a code or secret is masked before it's stored.
  function scrub(s) {
    return String(s)
      .replace(/([?&](?:key|api_key|token)=)[^&\s"']+/gi, "$1[hidden]")

/* ---- dd.diag.js ---- */
/* ===== DigiDoughnut Platform · dd.diag =====
   Hidden support tool. Triple-click (or triple-tap) the footer to open a report that support
   can read from one screenshot, with a Copy button. Codes and keys are never shown.
   Other modules add their own section: dd.diag.addSection("Sync", function () { return ["State: on", ...]; }) */
(function () {
  "use strict";

  diag.addSection = function (title, fn) { sections.push({ title: title, fn: fn }); };

  function core() {
    var p = dd.getProgram && dd.getProgram();
    var b = window.DD_BUILD || {};
    var e = dd.env || {};
    var out = [];
    out.push("--- Program ---");
    out.push((p ? p.name + " " + p.version + " (data v" + p.schemaVersion + ")" : "not started") +
             " · platform " + (b.platform || "dev") + " · built " + (b.built || "-") + " " + (b.commit || ""));
    out.push("--- Page ---");
    out.push((e.isFile ? "Opened from a file on this computer" : "Hosted at " + location.host) +
             (e.isStandalone ? " · Home Screen app" : " · browser tab"));
    out.push("--- Device ---");
    out.push((e.isIOS ? "iPhone/iPad" : e.isAndroid ? "Android" : e.isPhone ? "phone" : "computer") +
             " · screen " + screen.width + "×" + screen.height + " · " + (navigator.onLine ? "online" : "offline"));
    out.push(navigator.userAgent);
    out.push("--- Storage ---");
    out.push("Saving works: " + (dd.store.available() ? "yes" : "NO") +
             " · keep-storage request: " + dd.store.persisted +
             (p ? " · data " + dd.store.dataBytes(p.id) + " bytes" + (dd.isExample() ? " (example)" : "") : ""));
    if (p && dd.store.get(dd.store.programKey(p.id, "data_recovery")) != null) out.push("A recovery copy of older data is saved on this device.");
    out.push("--- Last problems (newest first) ---");
    var log = dd.errors.recent();
    if (!log.length) out.push("No problems recorded. Everything's talking fine.");
    log.forEach(function (r) { out.push(r.when + " · " + r.where + " · " + r.detail); });
    return out;
  }

  diag.text = function () {
    var lines = core();
    sections.forEach(function (s) {
      lines.push("--- " + s.title + " ---");
      try { lines = lines.concat(s.fn()); } catch (e) { lines.push("(couldn't read: " + e.message + ")"); }
    });

    var text = diag.text();
    var sh = dd.ui.sheet('<h2>Support details</h2>' +
      '<p class="dd-note">If DigiDoughnut support asked for this, take a screenshot or tap Copy and paste it into your message.</p>' +
      '<pre id="dd-diag-text"></pre>' +
      '<div class="dd-btnrow"><button class="dd-btn" data-copy>Copy</button><button class="dd-btn ghost" data-close>Close</button></div>');
    sh.querySelector("#dd-diag-text").textContent = text;
    sh.querySelector("[data-close]").addEventListener("click", dd.ui.closeSheet);
    sh.querySelector("[data-copy]").addEventListener("click", function () {
      copyText(text).then(function (ok) { dd.ui.toast(ok ? "Copied." : "Couldn't copy. A screenshot works too."); });
    });
  };

  function copyText(t) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(t).then(function () { return true; }, fallback);
    return Promise.resolve(fallback());
    function fallback() {
      var ta = document.createElement("textarea"); ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
      ta.remove(); return ok;
    }
  }

    if (attached) return;

    attached = true;
    var n = 0, t = null;

  };
})();

/* ---- dd.ai.js ---- */
/* ===== DigiDoughnut Platform · dd.ai =====
   The AI connection layer. Programs never call an AI company directly: they call
   dd.ai.chat() / dd.ai.connect(), and this module picks the code, the model and the adapter.

   - Provider registry: each company is a small data entry. Launch lineup: Google only
     (Oran, 2026-10-06). Adding a company later = a registry entry (+ an adapter if it speaks
     a new dialect). API addresses live HERE, in the program, never in the noticeboard file.
   - Neutral tools: programs declare tools once ({name, description, params}); the adapter
     writes the company's schema. Nobody hand-writes Gemini schemas, so the old
     "required goes inside parameters" bug can't come back.
   - Hard limits: 30 s per request, 60 s and 5 tool rounds per turn, Stop at any time.
     The endless "thinking…" can't happen.
   - Every failure maps to one of dd.errors' seven friendly types.

   Facts below were checked against Google's docs on 2026-10-06 (models, free tier, errors).
   The buyer never sees a model name; the diagnostic does. */

  "use strict";
  var dd = window.dd = window.dd || {};

  ai.limits = { request: 30000, turn: 60000, rounds: 5 };   // tests shrink these
  var CONN_KEY = "dd_ai_connections_v1", MODELS_KEY = "dd_ai_models_v1", LEGACY_KEY = "dd_gemini_key_v1";
  var RECHECK_MS = 7 * 24 * 3600 * 1000;

  /* ---------- provider registry ---------- */

    google: {
      id: "google", label: "Google", adapter: "gemini",
      codePattern: /^AIza[0-9A-Za-z_\-]{30,}$/,
      getCodeUrl: "https://aistudio.google.com/apikey",   // overridable via noticeboard helpLinks.getCode_google
      base: "https://generativelanguage.googleapis.com/v1beta",
      free: true,
      // Model picking hints: never shown to the buyer.
      exclude: /(tts|live|audio|transcri|image|banana|embed|robotics|veo|lyria|imagen|research|aqa|gemma|computer|learnlm|thinking-exp)/i,
      privacyNote: "Google may use what you send through its free plan to improve its products, and people at Google may read it. Don't put anything private in your messages to the helper."
    }
  };

  /* The "get a free code" page for a company (noticeboard can update it). */
  ai.getCodeLink = function (id) {
    var p = ai.providers[id || "google"];
    return dd.notes ? dd.notes.link("getCode_" + p.id, p.getCodeUrl) : p.getCodeUrl;
  };

  /* Which company does a pasted code belong to? Returns a provider id or null. */
  ai.detectProvider = function (code) {
    code = String(code || "").trim();
    var hints = (dd.notes && dd.notes.get("codePatterns")) || {};
    for (var id in ai.providers) {
      var p = ai.providers[id];
      var re = p.codePattern;

      if (re.test(code)) return id;

    // Profit Coach POC kept a bare Gemini key: move it across once.

          if (!r.ok) throw adapters.gemini.problem(r, "list");
          ((r.body && r.body.models) || []).forEach(function (m) {
            if ((m.supportedGenerationMethods || []).indexOf("generateContent") >= 0) all.push(String(m.name).replace(/^models\//, ""));
          });
          var next = r.body && r.body.nextPageToken;
          return next && all.length < 2000 ? page(next) : all;
        });
      }
      return page(null);
    },

    /* Neutral tools -> Gemini functionDeclarations. `required` goes INSIDE `parameters`. */
    tools: function (tools) {
      if (!tools || !tools.length) return undefined;
      return [{ functionDeclarations: tools.map(function (t) {
        var props = {}, required = [];
        Object.keys(t.params || {}).forEach(function (k) {
          var s = t.params[k], o = { type: s.type || "string" };
          if (s.description) o.description = s.description;
          if (s.enum) o.enum = s.enum;
          if (s.type === "array") o.items = s.items || { type: "string" };
          if (s.type === "object" && s.properties) o.properties = s.properties;
          props[k] = o;
          if (!s.optional) required.push(k);
        });
        var decl = { name: t.name, description: t.description || t.name, parameters: { type: "object", properties: props } };
        if (required.length) decl.parameters.required = required;
        return decl;
      }) }];
    },

    /* Neutral history -> Gemini contents. Model turns are sent back exactly as Google sent
       them (raw parts), which carries any thought signatures newer models require. */
    contents: function (history) {
      var out = [];
      history.forEach(function (h) {
        if (h.role === "user") out.push({ role: "user", parts: [{ text: h.text }] });
        else if (h.role === "model") out.push({ role: "model", parts: (h.raw && h.raw.provider === "gemini") ? h.raw.parts : [{ text: h.text || "" }] });
        else if (h.role === "tool") out.push({ role: "user", parts: h.results.map(function (r) {
          var fr = { name: r.name, response: { result: r.result } };
          if (r.id) fr.id = r.id;   // newer models tag each call with an id; echo it back
          return { functionResponse: fr };
        }) });
      });
      return out;
    },

    send: function (p, code, model, req) {
      var body = { contents: adapters.gemini.contents(req.history) };
      if (req.system) body.systemInstruction = { parts: [{ text: req.system }] };
      var tools = adapters.gemini.tools(req.tools);
      if (tools) body.tools = tools;
      if (req.forceTool) body.toolConfig = { functionCallingConfig: { mode: "ANY", allowedFunctionNames: [req.forceTool] } };
      return request(p.base + "/models/" + encodeURIComponent(model) + ":generateContent",
        { method: "POST", headers: adapters.gemini.headers(code), body: JSON.stringify(body) }, req.ms).then(function (r) {
        if (!r.ok) throw adapters.gemini.problem(r, "send");
        var cand = r.body && r.body.candidates && r.body.candidates[0];
        var parts = (cand && cand.content && cand.content.parts) || [];
        var text = "", calls = [];
        parts.forEach(function (pt, i) {
          if (pt.text && !pt.thought) text += pt.text;
          if (pt.functionCall) calls.push({ id: pt.functionCall.id || null, name: pt.functionCall.name, args: pt.functionCall.args || {} });
        });
        if (!parts.length && r.body && r.body.promptFeedback && r.body.promptFeedback.blockReason) text = "";
        return { text: text.trim(), calls: calls, raw: { provider: "gemini", parts: parts.length ? parts : [{ text: "" }] },
                 finish: cand && cand.finishReason };
      });
    },

    /* Turn a failed response into {type, retry, wait, rediscover}. Only a real bad-key reason
       says "bad code" (fixes POC problem #6). */
    problem: function (r, where) {
      if (r.stopped) return { type: "stopped" };
      if (r.timeout) return { type: "timeout" };
      if (r.network) return { type: "offline", raw: r.error };
      var err = (r.body && r.body.error) || {};
      var msg = String(err.message || r.text || "");
      var status = String(err.status || "");
      var details = JSON.stringify(err.details || "");
      var raw = "HTTP " + r.status + " " + status + " " + msg.slice(0, 300) + " " + details.slice(0, 200);
      var out = { raw: raw, status: r.status };
      var badKey = /API_KEY_INVALID|API key not valid|API key expired|key is missing, invalid|invalid api key/i.test(msg + details);
      if (r.status === 401 || badKey) out.type = "bad_code";
      else if (r.status === 404 || /no longer available|is not found|not supported for generateContent|model_not_found/i.test(msg)) { out.type = "unexpected"; out.rediscover = true; }
      else if (r.status === 403 || /PERMISSION_DENIED|reported as leaked|SERVICE_DISABLED|API_KEY_SERVICE_BLOCKED/i.test(status + msg + details)) out.type = "not_allowed";
      else if (/location is not supported|FAILED_PRECONDITION/i.test(msg + status)) { out.type = "not_allowed"; out.region = true; }
      else if (r.status === 429 || r.status === 402) {
        out.type = "out_of_share";
        // A per-minute limit clears in seconds: wait and retry once. A daily one doesn't.
        var perMinute = /PerMinute|per minute|requests per min/i.test(details + msg) && !/PerDay|per day/i.test(details + msg);
        var m = details.match(/"retryDelay":"(\d+(?:\.\d+)?)s"/);
        if (perMinute) { out.retry = true; out.wait = Math.min(m ? parseFloat(m[1]) * 1000 : 5000, 15000); }
      }
      else if (r.status >= 500 || r.status === 499) { out.type = "busy"; out.retry = true; out.wait = 2500; }
      else out.type = "unexpected";
      return out;
    }
  };

  /* ---------- model choice ---------- */
  function pickModel(conn, force) {
    var p = ai.providers[conn.provider], ad = adapters[p.adapter];
    var all = models(), m = all[conn.provider];
    var stale = !m || !m.checkedAt || Date.now() - m.checkedAt > RECHECK_MS;
    if (m && m.model && !force && !stale) return Promise.resolve(m.model);
    return ad.listModels(p, conn.code).then(function (ids) {
      var ranked = ai.rankModels(conn.provider, ids);
      if (!ranked.length) throw { type: "unexpected", raw: "no usable models in list of " + ids.length };
      // Weekly re-check moves to the best model on the list. If it misbehaves, the next
      // call falls back down the candidate list on its own.
      var keep = ranked[0];
      all[conn.provider] = { model: keep, candidates: ranked.slice(0, 8), checkedAt: Date.now() };
      saveModels(all);
      return keep;
    }).catch(function (e) {
      // Quiet weekly re-check failed but we still have a model: keep using it.
      if (m && m.model && !force && !(e && e.type === "bad_code")) return m.model;
      throw e;
    });
  }
  function nextCandidate(provider, failed) {
    var all = models(), m = all[provider]; if (!m) return null;
    m.candidates = (m.candidates || []).filter(function (id) { return id !== failed; });
    m.model = m.candidates[0] || null; saveModels(all);
    return m.model;
  }

  /* ---------- connect: test a pasted code with ONE REAL TOOL CALL ----------
     (fixes POC problem #7: a code could pass "say ok" and then fail when Penny used tools)
     Resolves {ok:true, provider, label} or {ok:false, type, title, help}. */
  ai.connect = function (rawCode, providerId) {
    var code = ai.cleanCode(rawCode);
    if (!code) return Promise.resolve(fail({ type: "bad_code" }, null, "Paste your code first."));
    var provider = providerId || ai.detectProvider(code);
    if (!provider) return Promise.resolve(fail({ type: "bad_code" }, null));
    var p = ai.providers[provider], ad = adapters[p.adapter];
    var conn = { provider: provider, code: code };
    stopped = false;
    var ranked = [], lastProblem = null;
    return ad.listModels(p, code).then(function (ids) {
      ranked = ai.rankModels(provider, ids);
      if (!ranked.length) throw { type: "unexpected", raw: "no usable models" };
      return tryModels(ranked.slice(0, 4), 0);
    }).then(function (model) {
      var c = loadConns(); c.main = { provider: provider, code: code, savedAt: new Date().toISOString() };
      var saved = dd.store.setJSON(CONN_KEY, c);
      if (!saved.ok) return fail({ type: saved.reason }, provider);
      dd.store.remove(LEGACY_KEY);
      var all = models(); all[provider] = { model: model, candidates: [model].concat(ranked.filter(function (id) { return id !== model; })).slice(0, 8), checkedAt: Date.now() }; saveModels(all);
      dd.emit("ai:changed", { connected: true, provider: provider });
      return { ok: true, provider: provider, label: p.label };
    }).catch(function (e) { return fail(e, provider); });

    function tryModels(list, i) {
      if (i >= list.length) throw lastProblem || { type: "unexpected", raw: "no model passed the tool test" };
      var model = list[i];
      return ad.send(p, code, model, {
        system: "You are a connection test.", ms: ai.limits.request, forceTool: "confirm_ready",
        history: [{ role: "user", text: "Call confirm_ready with word set to ready." }],
        tools: [{ name: "confirm_ready", description: "Confirms the connection works.", params: { word: { type: "string", description: "Always 'ready'" } } }]
      }).then(function (res) {
        if (res.calls.some(function (c) { return c.name === "confirm_ready"; })) return model;
        lastProblem = { type: "unexpected", raw: model + " answered without using the tool" };
        return tryModels(list, i + 1);
      }, function (e) {
        // A bad code, no internet or Stop won't get better with another model: stop here.
        if (e.type === "bad_code" || e.type === "offline" || e.type === "stopped" || e.type === "not_allowed" && !e.rediscover) throw e;
        lastProblem = e; dd.errors.record("ai.connect:" + model, e.raw || e.type);
        return tryModels(list, i + 1);
      });
    }
  };

  function fail(e, provider, title) {
    if (e && e.raw) dd.errors.record("ai", e.raw);
    var type = (e && e.type) || "unexpected";
    var f = dd.errors.friendly(type === "stopped" ? "unexpected" : type, { company: provider && ai.providers[provider] ? ai.providers[provider].label : undefined });
    if (title) f.title = title;
    if (e && e.region) f.help = "Google's free plan doesn't work in your country yet.";
    if (type === "bad_code" && !provider && !title) f.help = "That doesn't look like a code from Google. Copy it again with Google's Copy button and paste it here.";
    return { ok: false, type: type, stopped: type === "stopped", title: f.title, help: f.help };
  }

  /* ---------- chat: one helper turn, running tools as the model asks ----------
     req = { system, history:[neutral turns], tools:[neutral tools with run(args) ],
             onStatus(fn), onToolCall(call) }
     Every function call in a reply is run, in order (fixes POC problem #2).
     Resolves { ok, text, history (new turns appended), calls:[...] } or { ok:false, ... }. */
  ai.chat = function (req) {
    var conns = loadConns();
    if (!conns.main) return Promise.resolve(fail({ type: "bad_code" }, null, "The helper needs your free access code first."));
    var conn = conns.main, p = ai.providers[conn.provider], ad = adapters[p.adapter];
    var history = (req.history || []).slice();
    var started = Date.now(), rounds = 0, retried = 0, rediscovered = false, ran = [];
    var status = req.onStatus || function () {};
    stopped = false;

    function left() { return ai.limits.turn - (Date.now() - started); }

    function step(model) {
      if (stopped) return Promise.reject({ type: "stopped" });
      var ms = Math.min(ai.limits.request, left());
      if (ms <= 500) return Promise.reject({ type: "timeout", raw: "turn budget used up" });
      status(rounds ? "working" : "thinking");
      return ad.send(p, conn.code, model, { system: req.system, history: history, tools: req.tools, ms: ms }).then(function (res) {
        history.push({ role: "model", text: res.text, calls: res.calls, raw: res.raw });
        if (!res.calls.length) return { ok: true, text: res.text, history: history, calls: ran, model: model };
        if (++rounds > ai.limits.rounds) return { ok: true, text: res.text || "", history: history, calls: ran, model: model, cappedRounds: true };
        // Run every call in order, collect every result, send them back together.
        var results = [];
        return res.calls.reduce(function (chain, call) {
          return chain.then(function () {
            if (stopped) throw { type: "stopped" };
            var tool = (req.tools || []).filter(function (t) { return t.name === call.name; })[0];
            if (req.onToolCall) try { req.onToolCall(call); } catch (e) {}
            return Promise.resolve(tool ? tool.run(call.args || {}, call) : { ok: false, message: "No tool called " + call.name })
              .catch(function (e) { dd.errors.record("tool:" + call.name, e); return { ok: false, message: "That didn't work." }; })
              .then(function (result) { results.push({ id: call.id, name: call.name, result: result }); ran.push({ name: call.name, args: call.args, result: result }); });
          });
        }, Promise.resolve()).then(function () {
          history.push({ role: "tool", results: results });
          return step(model);
        });
      }, function (e) {
        if (e.type === "stopped") throw e;
        if (e.rediscover && !rediscovered) {
          rediscovered = true; dd.errors.record("ai.model", e.raw);
          var next = nextCandidate(conn.provider, model);
          return (next ? Promise.resolve(next) : pickModel(conn, true)).then(step);
        }
        if (e.retry && retried < 2 && left() > (e.wait || 0) + 3000) {
          retried++; status("retrying"); dd.errors.record("ai.retry", e.raw);
          return wait(e.wait || 2500).then(function () { return step(model); });
        }
        throw e;
      });
    }

    return pickModel(conn).then(step).catch(function (e) {
      var out = fail(e, conn.provider);
      out.history = history; out.calls = ran;
      return out;
    });
  };

  /* Speed check (AI test page only): times each kind of request with a generous limit,
     so we can see what's slow. Resolves [{step, secs, outcome}]. */
  ai.speedCheck = function (limitMs) {
    var conn = loadConns().main; if (!conn) return Promise.resolve([{ step: "no code saved", secs: "-", outcome: "-" }]);
    var p = ai.providers[conn.provider], ad = adapters[p.adapter], out = [], keep = ai.limits.request;
    ai.limits.request = limitMs || 90000; stopped = false;
    function timed(step, fn) {
      var t = Date.now();
      return fn().then(function (r) { out.push({ step: step, secs: ((Date.now() - t) / 1000).toFixed(1), outcome: r }); },
                       function (e) { out.push({ step: step, secs: ((Date.now() - t) / 1000).toFixed(1), outcome: "failed: " + (e.type || "?") + (e.status ? " (" + e.status + ")" : "") }); });
    }
    var model;
    return pickModel(conn).then(function (m) { model = m; })
      .then(function () { return timed("model list", function () { return ad.listModels(p, conn.code).then(function (ids) { return ids.length + " models"; }); }); })
      .then(function () { return timed("plain answer (" + model + ")", function () {
        return ad.send(p, conn.code, model, { ms: ai.limits.request, history: [{ role: "user", text: "Say hi in three words." }] }).then(function (r) { return "ok"; }); }); })
      .then(function () { return timed("tool answer (" + model + ")", function () {
        return ad.send(p, conn.code, model, { ms: ai.limits.request, history: [{ role: "user", text: "Add apples to my list." }],
          tools: [{ name: "add_item", description: "Add one item to the list.", params: { text: { type: "string" } } }] })
          .then(function (r) { return r.calls.length ? "ok, used the tool" : "ok, but answered without the tool"; }); }); })
      .then(function () { ai.limits.request = keep; return out; }, function (e) { ai.limits.request = keep; out.push({ step: "picking a model", secs: "-", outcome: "failed: " + (e.type || "?") }); return out; });
  };

  /* One-shot text answer without tools (e.g. the scripted guide's "ask anything" fallback). */
  ai.ask = function (prompt, system) {
    return ai.chat({ system: system, history: [{ role: "user", text: prompt }] });
  };

  function wait(ms) {
    return new Promise(function (resolve, reject) {
      var t = setTimeout(resolve, ms);
      var poll = setInterval(function () { if (stopped) { clearTimeout(t); clearInterval(poll); reject({ type: "stopped" }); } }, 200);
      setTimeout(function () { clearInterval(poll); }, ms + 50);
    });
  }

  /* ---------- support diagnostic ---------- */
  if (dd.diag) dd.diag.addSection("AI", function () {
    var c = loadConns().main, m = models();
    if (!c) return ["No access code saved."];
    var pm = m[c.provider] || {};
    return [
      (ai.providers[c.provider] ? ai.providers[c.provider].label : c.provider) + " code " + mask(c.code) + (c.migrated ? " (moved from older version)" : ""),
      "Model: " + (pm.model || "not picked yet") + (pm.checkedAt ? " · list checked " + new Date(pm.checkedAt).toLocaleDateString() : ""),
      "Candidates: " + ((pm.candidates || []).slice(0, 5).join(", ") || "-")
    ].concat(reqLog.length ? ["Recent requests (newest first):"].concat(reqLog.map(function (q) {
      return "  " + q.at + " · " + q.what + (q.model ? " " + q.model : "") + " · " + q.secs + " s · " + q.outcome;
    })) : ["No AI requests yet this visit."]);
  });
})();

/* ---- dd.notes.js ---- */
/* ===== DigiDoughnut Platform · dd.notes — the DigiDoughnut noticeboard =====
   Once a week, at most, the program downloads one small public file that DigiDoughnut keeps
   up to date. It can only carry:
     helpLinks   updated "I'm stuck" / help page links            (https only)
     labels      corrected button wording for setup screens        (plain text, short)
     notice      one short message for buyers                      (plain text)
     modelHints  AI models to prefer or avoid                      (model ids)
     codePatterns how to recognise an AI company's code            (pattern text)
   It can NEVER change where codes, numbers or messages are sent: those addresses are built
   into the program. Nothing is sent with the request: no codes, numbers, ids or settings.
   If the file can't be reached, the program works exactly the same with its built-in values.
   The buyer can read this in plain words under "Privacy" in the footer (Oran, 2026-10-06). */
(function () {
  "use strict";
  var dd = window.dd = window.dd || {};
  var notes = dd.notes = {};

  // PROGRAM-INDEPENDENT. Where the noticeboard lives (GitHub Pages on the public repo).
  notes.url = "https://budwakelam.github.io/digidoughnut/noticeboard/notes.json";
  var KEY = "dd_notes_v1", WEEK = 7 * 24 * 3600 * 1000;
  var LIMITS = { link: 300, label: 60, notice: 240, id: 40, list: 20 };

  var cached = dd.store.getJSON(KEY) || null;   // {fetchedAt, data, dismissed:[ids]}
  var data = (cached && cached.data) || {};

  notes.get = function (section) { return data[section]; };
  /* Help link by key, falling back to the built-in one. */
  notes.link = function (key, fallback) { var h = data.helpLinks || {}; return h[key] || fallback; };
  /* Button wording by key, falling back to the built-in one. Always plain text. */
  notes.label = function (key, fallback) { var l = data.labels || {}; return l[key] || fallback; };
  notes.lastChecked = function () { return cached && cached.okAt ? new Date(cached.okAt) : null; };
  notes.lastTried = function () { return cached && cached.triedAt ? new Date(cached.triedAt) : null; };

  /* ---------- validation: anything unexpected is dropped, never trusted ---------- */
  // Text from the file is only ever shown as plain text (never as HTML), so "</>" is safe.
  function str(v, max) { return typeof v === "string" && v.length > 0 && v.length <= max ? v : null; }
  function httpsUrl(v) {
    if (!str(v, LIMITS.link)) return null;
    try { var u = new URL(v); return u.protocol === "https:" ? u.href : null; } catch (e) { return null; }
  }
  function map(obj, fn) {
    var out = {}, n = 0;
    if (obj && typeof obj === "object") Object.keys(obj).forEach(function (k) {
      if (n >= 100 || !/^[A-Za-z0-9_.-]{1,60}$/.test(k)) return;
      var v = fn(obj[k]); if (v != null) { out[k] = v; n++; }
    });
    return out;
  }
  function idList(v) {
    return Array.isArray(v) ? v.filter(function (x) { return /^[a-z0-9.\-]{1,60}$/i.test(x); }).slice(0, LIMITS.list) : [];
  }
  notes.validate = function (raw) {
    if (!raw || typeof raw !== "object" || raw.version !== 1) return null;
    var out = {
      helpLinks: map(raw.helpLinks, httpsUrl),
      labels: map(raw.labels, function (v) { return str(v, LIMITS.label); }),
      modelHints: map(raw.modelHints, function (v) { return v && typeof v === "object" ? { prefer: idList(v.prefer), avoid: idList(v.avoid) } : null; }),
      codePatterns: map(raw.codePatterns, function (v) {
        if (!str(v, 120) || !/^\^/.test(v)) return null;
        try { new RegExp(v); return v; } catch (e) { return null; }
      })
    };
    var n = raw.notice;
    if (n && typeof n === "object" && str(n.id, LIMITS.id) && str(n.text, LIMITS.notice)) {
      var until = n.until && !isNaN(Date.parse(n.until)) ? n.until : null;
      out.notice = { id: n.id, text: n.text, until: until, link: httpsUrl(n.link) || null };
    }
    return out;
  };

  /* ---------- weekly check ---------- */
  notes.check = function (force) {
    if (!force && cached && cached.fetchedAt && Date.now() - cached.fetchedAt < WEEK) return Promise.resolve(false);
    if (navigator.onLine === false) return Promise.resolve(false);
    var ctl = new AbortController(), t = setTimeout(function () { ctl.abort(); }, 8000);
    // A plain GET: no cookies, no query string, no headers carrying anything about the buyer.
    return fetch(notes.url, { method: "GET", credentials: "omit", cache: "no-cache", referrerPolicy: "no-referrer", signal: ctl.signal })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (raw) {
        var clean = notes.validate(raw);
        if (!clean) throw new Error("noticeboard file not in the expected shape");
        data = clean;
        cached = { fetchedAt: Date.now(), okAt: Date.now(), triedAt: Date.now(), data: clean, dismissed: (cached && cached.dismissed) || [] };
        dd.store.setJSON(KEY, cached);
        showNotice();
        dd.emit("notes:updated", clean);
        return true;
      })
      .catch(function (e) {
        dd.errors.record("noticeboard", e);
        // Try again in a day rather than on every page load.
        cached = cached || { data: {}, dismissed: [] };
        cached.fetchedAt = Date.now() - WEEK + 24 * 3600 * 1000;
        cached.triedAt = Date.now();
        dd.store.setJSON(KEY, cached);
        return false;
      })
      .finally(function () { clearTimeout(t); });
  };

  function showNotice() {
    var n = data.notice;
    if (!n || !dd.ui) return;
    if (n.until && Date.parse(n.until) < Date.now()) return;
    if (cached && (cached.dismissed || []).indexOf(n.id) >= 0) return;
    var buttons = [{ label: "Got it", onClick: function () {
      cached.dismissed = (cached.dismissed || []).concat(n.id).slice(-20);
      dd.store.setJSON(KEY, cached); dd.ui.clearNotice("board");
    } }];
    if (n.link) buttons.unshift({ label: "Read more", primary: true, onClick: function () { window.open(n.link, "_blank", "noopener"); } });
    dd.ui.notice("board", n.text, "info", buttons);
  }

  /* Started by dd.core after the program is on screen, so it never delays the page. */
  notes.start = function () { showNotice(); setTimeout(function () { notes.check(false); }, 1500); };

  if (dd.diag) dd.diag.addSection("Noticeboard", function () {
    var d = notes.lastChecked(), t = notes.lastTried();
    return ["Last downloaded: " + (d ? d.toLocaleString() : "never") + " · last tried: " + (t ? t.toLocaleString() : "never") +
            " · help links " + Object.keys(data.helpLinks || {}).length +
            " · labels " + Object.keys(data.labels || {}).length +
            (data.notice ? " · notice " + data.notice.id : "")];
  });
})();

<script>
/* ===== PROGRAM-SPECIFIC code ===== */
/* ===== PROGRAM-SPECIFIC: Demo List =====
   A deliberately tiny program that exercises the platform: first-run example data, saving,
   a schema upgrade (v1 stored plain strings, v2 stores objects), and the friendly confirm.
   Copy this folder to start a new program. Everything not in this object comes from the platform. */
const DD_PROGRAM = {
  id: "demo",                       // lowercase letters/digits; becomes dd_demo_data_v1
  name: "Demo List",
  tagline: "A platform test program",
  version: "0.1.0",
  schemaVersion: 2,
  accent: "#2563eb",
  exampleNotice: "You're looking at an example list so you can try things out.",

  emptyData() { return { items: [] }; },

  exampleData() {
    return { items: [
      { id: "ex1", text: "Buy flour", done: false },
      { id: "ex2", text: "Book the market table", done: true },
      { id: "ex3", text: "Print price tags", done: false }
    ] };
  },

  // Called before any saved data is used. Return false and the platform keeps a recovery copy.
  validateData(d) {
    return !!d && Array.isArray(d.items) && d.items.every((i) =>
      i && typeof i.id === "string" && typeof i.text === "string" && typeof i.done === "boolean");
  },

  // Bring data from any older schema up to this one. fromVersion 0 = saved before envelopes existed.
  migrate(d, fromVersion) {
    let out = d || { items: [] };
    if (fromVersion < 2) {
      out = { items: (out.items || []).map((t, n) => typeof t === "string"
        ? { id: "m" + n + "_" + Date.now().toString(36), text: t, done: false } : t) };
    }
    return out;
  },

  // Runs once, after the platform frame is ready. Wire up static buttons here.
  mount(ctx) {
    const $ = ctx.ui.$;
    const add = () => {
      const box = $("demoNew"), text = box.value.trim();
      if (!text) { ctx.ui.status("demoStatus", "warn", "Type something first."); return; }
      ctx.update((d) => { d.items.push({ id: ctx.ui.uid("i"), text: text.slice(0, 120), done: false }); });
      box.value = ""; ctx.ui.clearStatus("demoStatus");
    };
    $("demoAdd").addEventListener("click", add);
    $("demoNew").addEventListener("keydown", (e) => { if (e.key === "Enter") add(); });
    $("demoClear").addEventListener("click", async () => {
      const yes = await ctx.ui.confirm("Clear the whole list?", "This removes every item. You can't undo it.", "Yes, clear it", "No, keep it", true);
      if (yes) dd.replaceData(DD_PROGRAM.emptyData(), { example: false, source: "clear" });
    });
  },

  // Draws the screen from ctx.data. Called after every change.
  render(ctx) {
    const list = ctx.ui.$("demoList"), esc = ctx.ui.esc;
    const items = ctx.data.items;
    ctx.ui.$("demoCount").textContent = items.filter((i) => !i.done).length + " to do";
    list.innerHTML = items.length ? "" : '<p class="dd-note">Nothing here yet. Add your first item above.</p>';
    items.forEach((item) => {
      const row = document.createElement("label");
      row.className = "demo-row" + (item.done ? " done" : "");
      row.innerHTML = '<input type="checkbox"' + (item.done ? " checked" : "") + '> <span>' + esc(item.text) +
                      '</span><button class="demo-x" aria-label="Remove ' + esc(item.text) + '">×</button>';
      row.querySelector("input").addEventListener("change", (e) =>
        ctx.update((d) => { d.items.find((i) => i.id === item.id).done = e.target.checked; }));
      row.querySelector(".demo-x").addEventListener("click", (e) => {
        e.preventDefault();
        ctx.update((d) => { d.items = d.items.filter((i) => i.id !== item.id); });
      });
      list.appendChild(row);
    });
  },

  // Phase 4 (Penny): what the AI sees each turn, and the tools she can use. Not used yet.
  summarizeForAI(ctx) { return ctx.data.items.map((i) => `${i.id}: ${i.text}${i.done ? " (done)" : ""}`).join("\n"); },
  tools: [],
  knowledge: "",
  suggestions: []
};

</script>
<script>
dd.start(typeof DD_PROGRAM !== "undefined" ? DD_PROGRAM : null);
</script>
</body>
</html>
